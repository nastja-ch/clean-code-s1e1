<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body class="page">
  <div class="aaa">
    <img id="img-matrix" src="./eisenhower-matrix.jpg">
    <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </div>
    
  <div class="centered-main-page-element">
    <p id="topSectionForAddingElementToList">
      <label id="label-new-task" for="new-task">Add Item</label>
      <div class="task-row-wrapper">
        <input id="new-task" class="list-tasks-input task" type="text">
        <button class="button">Add</button>
      </div>
    </p>
      <h3 class="section-title">Todo</h3>

      <ul class="list-tasks" id="incompleteTasks">
        <li class="list-tasks-item">
          <input type="checkbox" class="list-tasks-input">
          <label class="list-tasks-label task">Pay Bills</label>
          <input type="text" class="list-tasks-input task">
          <button class="button edit">Edit</button>
          <button class="button delete"><img src="./remove.svg" class="img-delete"></button>
        </li>
        
        <li class="list-tasks-item editMode">
          <input type="checkbox" class="list-tasks-input">
          <label class="list-tasks-label task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="list-tasks-input task">
          <button class="button edit">Save</button>
          <button class="button delete"><img src="./remove.svg" class="img-delete"></button>
        </li>
      </ul>
        
      <h3 class="section-title">Completed</h3>
      
      <ul class="list-tasks" id="completed-tasks">
        <li class="list-tasks-item">
          <input type="checkbox" class="list-tasks-input" checked>
          <label class="list-tasks-label task">See the Doctor</label>
          <input type="text" class="list-tasks-input task">
          <button class="button edit">Edit</button>
          <button class="button delete"><img src="./remove.svg" class="img-delete"></button>
        </li>
      </ul>
    </div>
  
  <script src="app.js"></script>
</body>
</html>
