<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body class="page">
  <header class="header">
    <img id="img-matrix" src="./eisenhower-matrix.jpg" alt="The Eisenhower Matrix">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
    
  <main class="main">
    <section class="section">
      <label id="label-new-task" for="new-task">Add Item</label>
      <div class="section__task-row">
        <input id="new-task" class="section__list-tasks-item-input task" type="text">
        <button class="section__button">Add</button>
      </div>
    </section>

    <section class="section">
      <h3 class="section__title">Todo</h3>

      <ul class="section__list-tasks" id="incompleted-tasks">
        <li class="section__list-tasks-item">
          <input type="checkbox" class="section__list-tasks-item-input">
          <label class="section__list-tasks-item-label task">Pay Bills</label>
          <input type="text" class="section__list-tasks-item-input task">
          <button class="section__button edit">Edit</button>
          <button class="section__button delete">
            <img src="./remove.svg" class="section__list-tasks-item-img-delete" alt="delete button">
          </button>
        </li>
        
        <li class="section__list-tasks-item edit-mode">
          <input type="checkbox" class="section__list-tasks-item-input">
          <label class="section__list-tasks-item-label task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="section__list-tasks-item-input task">
          <button class="section__button edit">Save</button>
          <button class="section__button delete">
            <img src="./remove.svg" class="section__list-tasks-item-img-delete" alt="delete button">
          </button>
        </li>
      </ul>
    </section>
        
    <section class="section">
      <h3 class="section__title">Completed</h3>
      
      <ul class="section__list-tasks" id="completed-tasks">
        <li class="section__list-tasks-item">
          <input type="checkbox" class="section__list-tasks-item-input" checked>
          <label class="section__list-tasks-item-label task">See the Doctor</label>
          <input type="text" class="section__list-tasks-item-input task">
          <button class="section__button edit">Edit</button>
          <button class="section__button delete">
            <img src="./remove.svg" class="section__list-tasks-item-img-delete" alt="delete button">
          </button>
        </li>
      </ul>
    </section>
  </main>
  
  <script src="app.js"></script>
</body>
</html>
